/* ═══ LOOT RUN · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Clear the floor, grab the shiny loot, go deeper. Co-op, 1–4 players; AI heroes fill the party.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ hero stats, monsters, loot rarities and item names, dungeon size
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   DUNGEON ....... building a floor from a seed (rooms, corridors, stairs), walls, paths
 *   SCENE ......... renderer, lights, the floor's tiles, walls, torches and stairs (drawn in code)
 *   MODELS ........ heroes, monsters and loot on the ground
 *   EFFECTS ....... particles, arrows, floating numbers, sounds
 *   HOST .......... floors, monsters, loot drops, pickups, the AI heroes. Only the host runs these.
 *   ME ............ moving, swinging, spinning, getting hurt, getting revived. Each player owns its own.
 *   HUD & RESULTS . floor, level, gear, party, minimap, results and the leaderboard
 *   INPUT ......... keyboard + mouse; thumb stick, ATTACK and SPIN on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the monsters):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: x, z, facing, hp, max hp,
 *     down, revive progress, swing and spin counts, floor id) about 10 times a second, `gear`
 *     (weapon and armor: [rarity, power]) when it changes, `hb` (heartbeat) once a second,
 *     `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `floor` {id, v, n, seed, phase: play|descend|over, endsAt, xp, kills, cleared, awards}
 *               ONE JSON field, written only on a change; v goes up on every write

 *       `loot`  items on the ground [id, kind, rarity, power, x, z]
 *       `bots`  the AI heroes, 10 times a second
 *     Every client builds the same map from floor.seed. A new host adopts all of it.
 *   - The party shares one XP pool (floor.xp): everyone is the same level.
 *   - Intents to the host: "hit" {m, d} when your swing reaches a monster, "pick" {i, x, z}
 *     to grab loot (the first to ask gets it, recorded in floor.awards with the item),
 *     "descend" on the open stairs, "again" for a new run.
 *   - Monsters hurt players with a "hurt" {to, d} event; the player takes it off its own hp.
 *     "arrow" and "slam" events are just for show (the host already decided the damage).
 *   - Your deepest floor, runs and kills are YOUR save (player.data, CONFIG.saveNs).
 *   - ?attract plays offline with AI heroes only (the preview video is recorded from it).
 *   - Leaderboard "deepest-floor": the deepest floor each player reached.

const MP_CONNECT = {

  room: 'loot-run',

let net = null, S = { entities: { players: {} }, shared: {} }, joinedAt = 0;
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {

/** A live-ops number (owners change it without code), else the CONFIG default. */

// ── DUNGEON ─────────────────────────────────────────────────────────────────────────

  if (!player) return;
  try { const r = await player.data.get(CONFIG.saveNs); if (r && r.data && r.data.v) save = { ...save, best: Math.max(save.best, +r.data.best || 0), runs: Math.max(save.runs, +r.data.runs || 0), kills: Math.max(save.kills, +r.data.kills || 0) }; } catch {}
}
function storeSave() {

  if (player) player.data.set(save, { namespace: CONFIG.saveNs }).catch((e) => { if (e && e.current) player.data.set(save, { namespace: CONFIG.saveNs, version: e.current.version }).catch(() => {}); });
}
function hud(f) {

  $("hurt").style.opacity = now - me.hurtAt < 250 && !ATTRACT ? 0.75 : 0;
  $("fade").style.opacity = f.phase === "descend" ? Math.min(1, 1 - (f.endsAt - Date.now()) / CONFIG.descendMs) * 0.9 : 0;
  if (ATTRACT) { for (const id of ["top", "side", "boss", "msg", "toast", "hint", "net"]) $(id).style.display = "none"; $("net").textContent = ""; return; }
  if (f.cleared && !wasCleared && f.phase === "play") { banner("Floor cleared!", "The stairs are open"); sfx("stairs"); }
  wasCleared = f.cleared;
  if (f.phase !== lastPhase) { if (f.phase === "descend") banner("Down the stairs…"); lastPhase = f.phase; }
  const L = level(f.xp);
  $("floor").innerHTML = `Floor ${f.n}<small>Level ${L} · ${f.cleared ? "stairs open" : mobList().length + " monsters left"}</small>`;
  $("hpBar").style.width = Math.max(0, (100 * me.hp) / me.mhp) + "%";
  $("xpBar").style.width = 100 * levelProgress(f.xp) + "%";
  $("gear").innerHTML = `<div style="color:${RARITY[me.w[0]].color}">⚔ ${ITEM_NAMES[0][me.w[0]]} · ${heroDmg(L, me.w)} dmg</div><div style="color:${RARITY[me.ar[0]].color}">🛡 ${ITEM_NAMES[1][me.ar[0]]} · ${Math.round(me.hp)}/${me.mhp}</div>`;
  $("party").innerHTML = team.filter((h) => h !== me).map((h) => `<div><span style="color:${esc(h.color)}">${esc(h.name)}${h.bot ? " (bot)" : ""}${h.dn ? " · down" : ""}</span><b><u style="width:${Math.max(0, (100 * h.hp) / (h.mhp || 1))}%;background:${h.dn ? "#ff4d6d" : "#52d273"}"></u></b></div>`).join("");
  const boss = mobList().find((m) => m.t === 4 && m.aw);
  $("boss").hidden = !boss;
  if (boss) $("boss").innerHTML = `THE BONE KING<div class="bar"><i style="width:${(100 * boss.hp) / (mobMaxHp(4, f.n) * (ATTRACT ? 2 : 1))}%"></i></div>`;
  $("msg").style.opacity = now < msgUntil ? 1 : 0; $("toast").style.opacity = now < toastUntil ? 1 : 0;
  const touch = matchMedia("(pointer: coarse)").matches;
  $("hint").textContent = touch ? "Left thumb moves · hold ATTACK to swing · SPIN hits all around · clear the floor, then take the stairs" : "WASD to move · aim with the mouse · click or Space to swing · E to spin · clear the floor, then take the stairs";
  $("hint").style.opacity = now - startedAt < 12000 ? 1 : 0;
  $("spin").classList.toggle("wait", me.scd > 0);
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : netDown ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the monsters" : ""}`;
  $("down").hidden = !me.dn || f.phase === "over";
  if (me.dn) $("down").textContent = me.rv > 0 ? "A friend is getting you up…" : "You're down! A friend can get you up";
  $("over").hidden = f.phase !== "over";
  if (f.phase === "over") {
    $("overTitle").textContent = `The party fell on floor ${f.n}`;
    $("overSub").textContent = `${f.kills} monsters slain · reached level ${L} · your deepest: floor ${Math.max(save.best, f.n)}`;
    $("overNext").textContent = `New run in ${Math.max(0, Math.ceil((f.endsAt - Date.now()) / 1000))}s`;
    if (boardFor !== f.id) { boardFor = f.id; showBoard(f.n); }
    if (runSaved !== f.id) { runSaved = f.id; save.runs++; save.kills += f.kills; save.best = Math.max(save.best, f.n); storeSave(); }
  }

}
function showBoard(n) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  board.submit(n).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>floor ${e.score}</span></li>`).join("") : "<li>No runs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
const mini = $("mini").getContext("2d");
function drawMini(f) {
  const d = D, k = 280 / Math.max(d.W, d.H), X = (x) => (x / T) * k, Z = (z) => (z / T) * k;
  mini.clearRect(0, 0, 280, 280);
  for (let y = 0; y < d.H; y++) for (let x = 0; x < d.W; x++) if (d.tile[y][x]) { mini.fillStyle = "#6d6290"; mini.fillRect(x * k, y * k, k + 0.5, k + 0.5); }
  mini.fillStyle = f.cleared ? "#ffd66b" : "#3b3450"; mini.fillRect(d.stairs.x * k - 2, d.stairs.y * k - 2, k + 4, k + 4);
  for (const it of lootList()) if (!me.picked.has(it.i)) { mini.fillStyle = it.k === 2 ? "#ff6b8a" : RARITY[it.r].color; mini.fillRect(X(it.x) - 2, Z(it.z) - 2, 5, 5); }
  for (const m of mobList()) { mini.fillStyle = m.t === 4 ? "#ff2d4a" : "#ff6b6b"; mini.beginPath(); mini.arc(X(m.x), Z(m.z), m.t === 4 ? 5 : 3, 0, TAU); mini.fill(); }
  for (const h of team) { if (h.fl !== f.id) continue; mini.fillStyle = h.color; mini.strokeStyle = h === me ? "#fff" : "#0008"; mini.lineWidth = 2; mini.beginPath(); mini.arc(X(h.x), Z(h.z), h === me ? 6 : 4.5, 0, TAU); mini.fill(); mini.stroke(); }
}
$("again").onclick = () => act("again");

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), cv = renderer.domElement, touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if (MOVE[k] || k === " ") e.preventDefault(); keys.add(k); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const mouse = { x: 0, y: 0, seen: false, down: false, right: false }, aim = { active: false, a: 0 };
const stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 }, stickEl = $("stick");
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; if (e.button === 0) mouse.down = true; if (e.button === 2) mouse.right = true; return; }
  if (stick.id === null) { Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 }); Object.assign(stickEl.style, { left: e.clientX + "px", top: e.clientY + "px" }); stickEl.hidden = false; }
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const d = Math.hypot(dx, dy);
  if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
  stick.dx = dx; stick.dy = dy; stickEl.firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.right = false; return; }
  if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; stickEl.hidden = true; }
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
const pads = { atk: false, spin: false };
for (const id of ["atk", "spin"]) {
  const b = $(id); b.hidden = !touchUI;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); pads[id] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, () => { pads[id] = false; b.classList.remove("on"); });
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1), aimAt = new THREE.Vector3();
/** Turn keys, mouse and touch into this frame's move, aim, swing and spin. The mouse aims through the camera that drew the frame. */
function readInput() {
  input.mx = input.mz = 0;
  for (const k of keys) if (MOVE[k]) { input.mx += MOVE[k][0]; input.mz += MOVE[k][1]; }
  if (stick.id !== null && Math.hypot(stick.dx, stick.dy) > 8) { input.mx = stick.dx / 50; input.mz = stick.dy / 50; }
  aim.active = false;
  if (mouse.seen && stick.id === null) {
    ndc.set((mouse.x / innerWidth) * 2 - 1, -(mouse.y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(aimPlane, aimAt)) { aim.active = true; aim.a = Math.atan2(aimAt.x - me.x, aimAt.z - me.z); }

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const focus = new THREE.Vector3(), camOff = new THREE.Vector3();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const f = floorMeta();
  if (f) {
    dungeon(f);
    if (!ATTRACT) readInput();
    myTick(dt, f);
    syncHeroes(dt, t, f); syncMobs(dt, t, f); syncLoot(t);
    stepArrows(dt); stepSlams(dt); stepBits(dt); stepFloats(dt);
    if (flames) flames.scale.y = 1 + Math.sin(t * 13) * 0.08;
    stairsParts.grate.visible = !f.cleared; stairsParts.glow.visible = f.cleared; stairsParts.glow.material.opacity = 0.2 + Math.sin(t * 4) * 0.08;
    // a 3/4 camera that follows me (higher on a phone held upright); a torch light on every hero
    const tall = innerHeight > innerWidth ? 1.35 : 1;
    camOff.set(0, 15.5, 10).multiplyScalar(tall * (ATTRACT ? 0.72 : 1));
    focus.lerp(P3.set(me.x, 0, me.z), 1 - Math.pow(0.003, dt));
    camera.position.copy(focus).add(camOff);
    shake = Math.max(0, shake - dt); if (shake > 0 && !ATTRACT) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.z += (Math.random() - 0.5) * shake; }
    camera.lookAt(focus);
    moon.position.set(focus.x - 10, 30, focus.z + 14); moon.target.position.copy(focus);
    const lit = team.filter((h) => h.fl === f.id).slice(0, 4);
    heroLights.forEach((l, i) => { const h = lit[i]; l.intensity = h ? (h === me ? 40 : 22) : 0; if (h) l.position.set(h.x, 2.6, h.z); });
    renderer.render(scene, camera);
    if (now - lastHud > 100) { lastHud = now; hud(f); }
  }
  requestAnimationFrame(frame);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => { if (host.acting && m) applyHit(m, from); });
  net.on("pick", (m, from) => { if (host.acting && m) applyPick({ i: +m.i, x: +m.x, z: +m.z }, from); });
  net.on("descend", () => { if (host.acting) applyDescend(); });
  net.on("again", () => { if (host.acting) applyAgain(); });
  net.on("hurt", (m) => { if (m && m.to === net.sessionId) hurtMe(m.d); });
  net.on("arrow", (m) => { if (m && typeof m.x === "number") shootArrow(m.x, m.z, m.a, 0); });
  net.on("slam", (m) => { if (m && typeof m.x === "number") startSlam(m.x, m.z, +m.r || 3); });
  net.onDisconnect(() => { netDown = true; });
  net.onReconnect(() => { netDown = false; });
  joinedAt = performance.now();
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });

  requestAnimationFrame(frame);
})();
